<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;">
  <defs>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Заголовок как в примере лекции -->
  <text x="60" y="52" font-size="26" font-weight="700" fill="#111827">У каждого сервиса — своё хранилище данных (Database per Service)</text>
  <text x="60" y="82" font-size="15" fill="#6B7280">Маркетплейс с собственным фулфилментом, доставкой последней мили и поддержкой Flash Sales</text>

  <!-- СЛОЙ 1: Клиентские приложения -->
  <g filter="url(#shadow)">
    <rect x="60" y="110" width="270" height="76" rx="16" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="195" y="145" font-size="17" font-weight="600" fill="#111827" text-anchor="middle">Покупатель (Клиент)</text>
    <text x="195" y="169" font-size="13" fill="#6B7280" text-anchor="middle">Мобильное приложение / Web</text>

    <rect x="370" y="110" width="270" height="76" rx="16" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="505" y="145" font-size="17" font-weight="600" fill="#111827" text-anchor="middle">Продавец (Селлер)</text>
    <text x="505" y="169" font-size="13" fill="#6B7280" text-anchor="middle">Личный кабинет / Seller API</text>

    <rect x="680" y="110" width="270" height="76" rx="16" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="815" y="145" font-size="17" font-weight="600" fill="#111827" text-anchor="middle">Сотрудник склада</text>
    <text x="815" y="169" font-size="13" fill="#6B7280" text-anchor="middle">Терминал сбора данных (WMS)</text>

    <rect x="990" y="110" width="270" height="76" rx="16" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="1125" y="145" font-size="17" font-weight="600" fill="#111827" text-anchor="middle">Курьер доставки</text>
    <text x="1125" y="169" font-size="13" fill="#6B7280" text-anchor="middle">Курьерское приложение (GPS)</text>

    <rect x="1300" y="110" width="240" height="76" rx="16" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="1420" y="145" font-size="16" font-weight="600" fill="#374151" text-anchor="middle">CDN + Object Storage</text>
    <text x="1420" y="169" font-size="13" fill="#6B7280" text-anchor="middle">Фото товаров, статика (S3)</text>
  </g>

  <!-- Стрелки от клиентов к API Gateway -->
  <line x1="195" y1="186" x2="195" y2="236" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <line x1="505" y1="186" x2="505" y2="236" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <line x1="815" y1="186" x2="815" y2="236" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <line x1="1125" y1="186" x2="1125" y2="236" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-grey)"/>

  <!-- СЛОЙ 2: API Gateway / Load Balancer -->
  <g filter="url(#shadow)">
    <rect x="120" y="242" width="1080" height="78" rx="16" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
    <text x="660" y="276" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">API Gateway / Load Balancer (L7 Envoy / Nginx)</text>
    <text x="660" y="301" font-size="14" fill="#4B5563" text-anchor="middle">TLS Termination  ·  JWT-аутентификация  ·  Rate Limiting (защита в Flash Sale)  ·  Маршрутизация запросов</text>
  </g>

  <!-- Горизонтальная шина распределения синхронных вызовов (REST / gRPC) -->
  <line x1="660" y1="320" x2="660" y2="352" stroke="#9CA3AF" stroke-width="2"/>
  <line x1="165" y1="352" x2="1425" y2="352" stroke="#9CA3AF" stroke-width="2"/>
  <line x1="165" y1="352" x2="165" y2="386" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <line x1="415" y1="352" x2="415" y2="386" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <line x1="665" y1="352" x2="665" y2="386" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <line x1="915" y1="352" x2="915" y2="386" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <line x1="1165" y1="352" x2="1165" y2="386" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <line x1="1425" y1="352" x2="1425" y2="386" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-grey)"/>

  <!-- СЛОЙ 3: Основные микросервисы (Синие блоки как в референсе Wolt/Glovo) -->
  <g filter="url(#shadow)">
    <!-- 1. Сервис каталога -->
    <rect x="55" y="392" width="220" height="92" rx="16" fill="#EBF3FE" stroke="#2563EB" stroke-width="2.5"/>
    <text x="165" y="430" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Сервис каталога</text>
    <text x="165" y="454" font-size="13" fill="#4B5563" text-anchor="middle">поиск, фильтры, цены</text>
    <text x="165" y="472" font-size="12" fill="#2563EB" text-anchor="middle">Read-heavy (AP)</text>

    <!-- 2. Сервис корзины -->
    <rect x="305" y="392" width="220" height="92" rx="16" fill="#EBF3FE" stroke="#2563EB" stroke-width="2.5"/>
    <text x="415" y="430" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Сервис корзины</text>
    <text x="415" y="454" font-size="13" fill="#4B5563" text-anchor="middle">состав, промокоды</text>
    <text x="415" y="472" font-size="12" fill="#2563EB" text-anchor="middle">Низкая задержка (AP)</text>

    <!-- 3. Сервис заказов -->
    <rect x="555" y="392" width="220" height="92" rx="16" fill="#EBF3FE" stroke="#2563EB" stroke-width="2.5"/>
    <text x="665" y="430" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Сервис заказов</text>
    <text x="665" y="454" font-size="13" fill="#4B5563" text-anchor="middle">создание, статус, Saga</text>
    <text x="665" y="472" font-size="12" fill="#1D4ED8" text-anchor="middle">Координатор (CP)</text>

    <!-- 4. Сервис склада и резерва -->
    <rect x="805" y="392" width="220" height="92" rx="16" fill="#EBF3FE" stroke="#2563EB" stroke-width="2.5"/>
    <text x="915" y="430" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Сервис склада (WMS)</text>
    <text x="915" y="454" font-size="13" fill="#4B5563" text-anchor="middle">резерв стока, ячейки</text>
    <text x="915" y="472" font-size="12" fill="#1D4ED8" text-anchor="middle">Строгий учёт (CP)</text>

    <!-- 5. Сервис платежей -->
    <rect x="1055" y="392" width="220" height="92" rx="16" fill="#EBF3FE" stroke="#2563EB" stroke-width="2.5"/>
    <text x="1165" y="430" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Сервис платежей</text>
    <text x="1165" y="454" font-size="13" fill="#4B5563" text-anchor="middle">холд, списание, чеки</text>
    <text x="1165" y="472" font-size="12" fill="#1D4ED8" text-anchor="middle">Идемпотентный (CP)</text>

    <!-- 6. Сервис доставки и трекинга -->
    <rect x="1305" y="392" width="240" height="92" rx="16" fill="#EBF3FE" stroke="#2563EB" stroke-width="2.5"/>
    <text x="1425" y="430" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Сервис трекинга</text>
    <text x="1425" y="454" font-size="13" fill="#4B5563" text-anchor="middle">маршруты, гео-позиция</text>
    <text x="1425" y="472" font-size="12" fill="#2563EB" text-anchor="middle">Write-heavy (AP)</text>
  </g>

  <!-- Стрелки от сервисов к их собственным БД -->
  <line x1="165" y1="484" x2="165" y2="534" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <line x1="415" y1="484" x2="415" y2="534" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <line x1="665" y1="484" x2="665" y2="534" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <line x1="915" y1="484" x2="915" y2="534" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <line x1="1165" y1="484" x2="1165" y2="534" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <line x1="1425" y1="484" x2="1425" y2="534" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-grey)"/>

  <!-- СЛОЙ 4: Собственные хранилища данных (Database per Service) -->
  <g filter="url(#shadow)">
    <rect x="55" y="540" width="220" height="82" rx="16" fill="#F9FAFB" stroke="#BDBDBD" stroke-width="2"/>
    <text x="165" y="575" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Elasticsearch + PG</text>
    <text x="165" y="598" font-size="12" fill="#6B7280" text-anchor="middle">Поисковый индекс + SKU</text>

    <rect x="305" y="540" width="220" height="82" rx="16" fill="#F9FAFB" stroke="#BDBDBD" stroke-width="2"/>
    <text x="415" y="575" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Кэш Redis (TTL)</text>
    <text x="415" y="598" font-size="12" fill="#6B7280" text-anchor="middle">Сессии и корзины в RAM</text>

    <rect x="555" y="540" width="220" height="82" rx="16" fill="#F9FAFB" stroke="#BDBDBD" stroke-width="2"/>
    <text x="665" y="575" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">SQL: Заказы (PG)</text>
    <text x="665" y="598" font-size="12" fill="#6B7280" text-anchor="middle">Шарды по buyer_id + Outbox</text>

    <rect x="805" y="540" width="220" height="82" rx="16" fill="#F9FAFB" stroke="#BDBDBD" stroke-width="2"/>
    <text x="915" y="575" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Redis + SQL: Склад</text>
    <text x="915" y="598" font-size="12" fill="#6B7280" text-anchor="middle">Бакеты резерва + остатки</text>

    <rect x="1055" y="540" width="220" height="82" rx="16" fill="#F9FAFB" stroke="#BDBDBD" stroke-width="2"/>
    <text x="1165" y="575" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">SQL: Платежи (PG)</text>
    <text x="1165" y="598" font-size="12" fill="#6B7280" text-anchor="middle">Строгий ACID + Аудит-лог</text>

    <rect x="1305" y="540" width="240" height="82" rx="16" fill="#F9FAFB" stroke="#BDBDBD" stroke-width="2"/>
    <text x="1425" y="575" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Гео-индекс (Redis)</text>
    <text x="1425" y="598" font-size="12" fill="#6B7280" text-anchor="middle">Координаты (TTL) + Треки</text>
  </g>

  <!-- Асинхронные связи (Пунктирные линии к брокеру сообщений Kafka) -->
  <line x1="665" y1="622" x2="665" y2="674" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-amber)"/>
  <line x1="915" y1="622" x2="915" y2="674" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-amber)"/>
  <line x1="1165" y1="622" x2="1165" y2="674" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-amber)"/>
  <line x1="165" y1="674" x2="165" y2="626" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-amber)"/>
  <line x1="1425" y1="674" x2="1425" y2="626" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-amber)"/>

  <!-- СЛОЙ 5: Асинхронная шина событий (Kafka) -->
  <g filter="url(#shadow)">
    <rect x="120" y="680" width="1360" height="76" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="800" y="714" font-size="17" font-weight="700" fill="#92400E" text-anchor="middle">Очередь событий / Брокер сообщений (Apache Kafka) — Асинхронная связность (Event-Driven / Saga)</text>
    <text x="800" y="738" font-size="13" fill="#B45309" text-anchor="middle">Топики:  order.created  ·  stock.reserved  ·  payment.completed  ·  order.packed  ·  courier.assigned  ·  catalog.price_changed</text>
  </g>

  <!-- Стрелки к фоновым асинхронным потребителям -->
  <line x1="480" y1="756" x2="480" y2="796" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-amber)"/>
  <line x1="1120" y1="756" x2="1120" y2="796" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-amber)"/>

  <!-- Фоновые сервисы -->
  <g filter="url(#shadow)">
    <rect x="260" y="802" width="440" height="72" rx="16" fill="#EBF3FE" stroke="#2563EB" stroke-width="2"/>
    <text x="480" y="834" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Сервис уведомлений (асинхронный)</text>
    <text x="480" y="856" font-size="13" fill="#4B5563" text-anchor="middle">Push / SMS / Email покупателям, чеки ОФД, алерты селлерам</text>

    <rect x="900" y="802" width="440" height="72" rx="16" fill="#EBF3FE" stroke="#2563EB" stroke-width="2"/>
    <text x="1120" y="834" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Сервис аналитики и биллинга селлеров</text>
    <text x="1120" y="856" font-size="13" fill="#4B5563" text-anchor="middle">Хранилище ClickHouse (OLAP) — отчёты продаж и выплат</text>
  </g>

  <!-- Подпись-легенда внизу -->
  <text x="800" y="925" font-size="14" fill="#6B7280" text-anchor="middle">архитектура верхнего уровня  ·  клиенты → API gateway → микросервисы → собственные хранилища + асинхронная шина событий (Kafka)</text>
</svg>
