<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;">
  <defs>
    <filter id="shadow3" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Заголовок как в примере лекции -->
  <text x="60" y="52" font-size="26" font-weight="700" fill="#111827">Заказ связывает покупателя, склад фулфилмента, курьера и товары продавцов</text>
  <text x="60" y="82" font-size="15" fill="#6B7280">ER-диаграмма ядра системы: 8 сущностей, Заказ (Order) в центре, связи N:M развязаны через промежуточные таблицы</text>

  <!-- Линии связей между сущностями (рисуем до блоков, чтобы не перекрывали) -->
  <!-- 1. Покупатель (1) — (N) Заказ -->
  <line x1="650" y1="225" x2="650" y2="330" stroke="#9CA3AF" stroke-width="2.5"/>
  <text x="665" y="252" font-size="16" font-weight="700" fill="#2563EB">1</text>
  <text x="665" y="318" font-size="16" font-weight="700" fill="#374151">N</text>

  <!-- 2. Заказ (1) — (N) Платёж -->
  <line x1="830" y1="360" x2="1050" y2="225" stroke="#9CA3AF" stroke-width="2.5"/>
  <text x="855" y="335" font-size="16" font-weight="700" fill="#2563EB">1</text>
  <text x="995" y="245" font-size="16" font-weight="700" fill="#374151">N</text>

  <!-- 3. Склад (1) — (N) Заказ -->
  <line x1="365" y1="415" x2="470" y2="415" stroke="#9CA3AF" stroke-width="2.5"/>
  <text x="382" y="402" font-size="16" font-weight="700" fill="#2563EB">1</text>
  <text x="445" y="402" font-size="16" font-weight="700" fill="#374151">N</text>

  <!-- 4. Курьер (1) — (N) Заказ -->
  <line x1="830" y1="415" x2="960" y2="415" stroke="#9CA3AF" stroke-width="2.5"/>
  <text x="845" y="402" font-size="16" font-weight="700" fill="#374151">N</text>
  <text x="935" y="402" font-size="16" font-weight="700" fill="#2563EB">1</text>

  <!-- 5. Заказ (1) — (N) Позиция заказа (OrderItem) -->
  <line x1="650" y1="505" x2="650" y2="600" stroke="#9CA3AF" stroke-width="2.5"/>
  <text x="665" y="532" font-size="16" font-weight="700" fill="#2563EB">1</text>
  <text x="665" y="588" font-size="16" font-weight="700" fill="#374151">N</text>

  <!-- 6. Позиция заказа (N) — (1) Товар (Product) -->
  <line x1="830" y1="670" x2="960" y2="670" stroke="#9CA3AF" stroke-width="2.5"/>
  <text x="845" y="656" font-size="16" font-weight="700" fill="#374151">N</text>
  <text x="935" y="656" font-size="16" font-weight="700" fill="#2563EB">1</text>

  <!-- 7. Склад (1) — (N) Остаток склада (WarehouseStock) -->
  <line x1="215" y1="490" x2="215" y2="600" stroke="#9CA3AF" stroke-width="2.5"/>
  <text x="230" y="518" font-size="16" font-weight="700" fill="#2563EB">1</text>
  <text x="230" y="588" font-size="16" font-weight="700" fill="#374151">N</text>

  <!-- 8. Остаток склада (N) — (1) Товар (Product) — огибающая линия снизу -->
  <polyline points="215,745 215,825 1110,825 1110,745" fill="none" stroke="#9CA3AF" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="230" y="775" font-size="16" font-weight="700" fill="#374151">N</text>
  <text x="1085" y="775" font-size="16" font-weight="700" fill="#2563EB">1</text>
  <text x="650" y="815" font-size="13" fill="#6B7280" text-anchor="middle">Развязка N:M «Товар ↔ Склад» через таблицу остатков WarehouseStock</text>

  <!-- 9. Продавец (1) — (N) Товар -->
  <line x1="1260" y1="670" x2="1340" y2="670" stroke="#9CA3AF" stroke-width="2.5"/>
  <text x="1272" y="656" font-size="16" font-weight="700" fill="#374151">N</text>
  <text x="1318" y="656" font-size="16" font-weight="700" fill="#2563EB">1</text>

  <!-- БЛОКИ СУЩНОСТЕЙ -->
  <g filter="url(#shadow3)">
    <!-- 1. Покупатель (User) -->
    <rect x="490" y="105" width="320" height="120" rx="18" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="520" y="140" font-size="18" font-weight="700" fill="#111827">Покупатель (User)</text>
    <text x="520" y="168" font-size="14" fill="#4B5563">id (PK)  ·  имя  ·  email</text>
    <text x="520" y="192" font-size="14" fill="#4B5563">телефон  ·  адрес_по_умолчанию</text>
    <text x="520" y="212" font-size="13" fill="#6B7280">created_at</text>

    <!-- 2. Платёж (Payment) -->
    <rect x="960" y="105" width="330" height="120" rx="18" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="990" y="140" font-size="18" font-weight="700" fill="#111827">Платёж (Payment)</text>
    <text x="990" y="168" font-size="14" fill="#4B5563">id (PK)  ·  order_id (FK)</text>
    <text x="990" y="192" font-size="14" fill="#4B5563">idempotency_key (UNIQUE)</text>
    <text x="990" y="212" font-size="14" fill="#4B5563">amount  ·  status  ·  paid_at</text>

    <!-- 3. Склад фулфилмента (Warehouse) -->
    <rect x="65" y="340" width="300" height="150" rx="18" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="95" y="376" font-size="18" font-weight="700" fill="#111827">Склад (Warehouse)</text>
    <text x="95" y="404" font-size="14" fill="#4B5563">id (PK)  ·  название</text>
    <text x="95" y="428" font-size="14" fill="#4B5563">регион  ·  гео_координаты</text>
    <text x="95" y="452" font-size="14" fill="#4B5563">тип (Фулфилмент / Даркстор)</text>
    <text x="95" y="474" font-size="13" fill="#6B7280">is_active</text>

    <!-- 4. ЦЕНТРАЛЬНАЯ СУЩНОСТЬ: ЗАКАЗ (Order) -->
    <rect x="470" y="330" width="360" height="175" rx="20" fill="#EBF3FE" stroke="#2563EB" stroke-width="3"/>
    <text x="500" y="368" font-size="20" font-weight="700" fill="#111827">Заказ (Order)</text>
    <text x="500" y="398" font-size="15" fill="#1E3A8A" font-weight="600">id (PK)  ·  buyer_id (FK)</text>
    <text x="500" y="424" font-size="15" fill="#1E3A8A" font-weight="600">warehouse_id (FK)  ·  courier_id (FK)</text>
    <text x="500" y="450" font-size="14" fill="#374151">status (NEW / RESERVED / PAID / DELIVERED)</text>
    <text x="500" y="474" font-size="14" fill="#374151">total_amount  ·  delivery_address</text>
    <text x="500" y="494" font-size="13" fill="#4B5563">delivery_slot  ·  created_at</text>

    <!-- 5. Курьер (Courier) -->
    <rect x="960" y="340" width="300" height="150" rx="18" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="990" y="376" font-size="18" font-weight="700" fill="#111827">Курьер (Courier)</text>
    <text x="990" y="404" font-size="14" fill="#4B5563">id (PK)  ·  имя  ·  телефон</text>
    <text x="990" y="428" font-size="14" fill="#4B5563">рейтинг  ·  тип_транспорта</text>
    <text x="990" y="452" font-size="14" fill="#4B5563">текущая_зона_доставки</text>
    <text x="990" y="474" font-size="13" fill="#6B7280">статус_смены (ONLINE / BUSY)</text>

    <!-- 6. Остаток на складе (WarehouseStock — промежуточная таблица N:M) -->
    <rect x="65" y="600" width="300" height="145" rx="18" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="95" y="634" font-size="17" font-weight="700" fill="#111827">Остаток (WarehouseStock)</text>
    <text x="95" y="660" font-size="14" fill="#2563EB" font-weight="600">warehouse_id (PK, FK)</text>
    <text x="95" y="684" font-size="14" fill="#2563EB" font-weight="600">product_id (PK, FK)</text>
    <text x="95" y="708" font-size="14" fill="#4B5563">available_qty  ·  reserved_qty</text>
    <text x="95" y="730" font-size="13" fill="#6B7280">bin_location (ячейка)  ·  version</text>

    <!-- 7. Позиция заказа (OrderItem — промежуточная таблица N:M) -->
    <rect x="470" y="600" width="360" height="145" rx="18" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="500" y="634" font-size="18" font-weight="700" fill="#111827">Позиция заказа (OrderItem)</text>
    <text x="500" y="660" font-size="14" fill="#2563EB" font-weight="600">id (PK)  ·  order_id (FK)</text>
    <text x="500" y="684" font-size="14" fill="#2563EB" font-weight="600">product_id (FK)  ·  seller_id (FK)</text>
    <text x="500" y="708" font-size="14" fill="#4B5563">quantity (кол-во)  ·  price_at_purchase</text>
    <text x="500" y="730" font-size="13" fill="#6B7280">discount_amount  ·  item_status</text>

    <!-- 8. Товар / SKU (Product) -->
    <rect x="960" y="600" width="300" height="145" rx="18" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="990" y="634" font-size="18" font-weight="700" fill="#111827">Товар / SKU (Product)</text>
    <text x="990" y="660" font-size="14" fill="#2563EB" font-weight="600">id (PK)  ·  seller_id (FK)</text>
    <text x="990" y="684" font-size="14" fill="#4B5563">category_id  ·  название</text>
    <text x="990" y="708" font-size="14" fill="#4B5563">base_price  ·  promo_price</text>
    <text x="990" y="730" font-size="13" fill="#6B7280">вес_г  ·  габариты_см  ·  rating</text>

    <!-- 9. Продавец (Seller) -->
    <rect x="1340" y="600" width="215" height="145" rx="18" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="1362" y="634" font-size="17" font-weight="700" fill="#111827">Продавец (Seller)</text>
    <text x="1362" y="660" font-size="14" fill="#2563EB" font-weight="600">id (PK)</text>
    <text x="1362" y="684" font-size="14" fill="#4B5563">название  ·  ИНН</text>
    <text x="1362" y="708" font-size="14" fill="#4B5563">рейтинг  ·  комиссия</text>
    <text x="1362" y="730" font-size="13" fill="#6B7280">счёт_выплат</text>
  </g>

  <text x="800" y="925" font-size="14" fill="#6B7280" text-anchor="middle">ER-диаграмма  ·  Заказ (Order) в центре, промежуточные сущности OrderItem и WarehouseStock раскрывают связи многие-ко-многим (N:M)</text>
</svg>
